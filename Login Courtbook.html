<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Website — CourtBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { inter: ['Inter', 'sans-serif'] },
                    colors: {
                        court: { 500: '#3B82F6', 600: '#2563EB', 400: '#60A5FA' },
                        book: { 500: '#22C55E', 600: '#16A34A', 400: '#4ADE80', 300: '#86EFAC' }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; overflow-x: hidden; transition: background-color 0.5s ease, color 0.5s ease; }
        
        /* Background & Utilities */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .noise-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        
        .glass-strong { background: rgba(10,10,10,0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s ease; }
        .input-glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #fff; transition: all 0.3s ease; }
        .input-glass:focus { background: rgba(255,255,255,0.05); border-color: rgba(34,197,94,0.5); outline: none; box-shadow: 0 0 0 3px rgba(34,197,94,0.1); }
        .input-glass.admin-focus:focus { border-color: rgba(59,130,246,0.5); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        .btn-primary { background: linear-gradient(135deg, #22C55E, #16A34A); box-shadow: 0 0 20px rgba(34,197,94,0.2); transition: all 0.3s ease; }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(34,197,94,0.4); transform: translateY(-1px); }
        
        .btn-admin { background: linear-gradient(135deg, #3B82F6, #2563EB); box-shadow: 0 0 20px rgba(59,130,246,0.2); transition: all 0.3s ease; }
        .btn-admin:hover { box-shadow: 0 0 30px rgba(59,130,246,0.4); transform: translateY(-1px); }

        .tab-btn { transition: all 0.3s ease; }
        .tab-btn.active-user { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.3); color: #4ADE80; }
        .tab-btn.active-admin { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.3); color: #60A5FA; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Light Theme Overrides */
        body.light-theme { background: #f8fafc; color: #0f172a; }
        body.light-theme .noise-bg { opacity: 0.05; filter: invert(1); }
        body.light-theme .glass-strong { background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        
        body.light-theme .input-glass { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.1); color: #0f172a; }
        body.light-theme .input-glass::placeholder { color: #64748b; }
        body.light-theme .input-glass:focus { background: rgba(255,255,255,1); border-color: #22C55E; box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
        body.light-theme .input-glass.admin-focus:focus { border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        
        body.light-theme .text-neutral-400 { color: #475569 !important; }
        body.light-theme .text-neutral-500 { color: #64748b !important; }
        body.light-theme .hover\:bg-white\/5:hover { background-color: rgba(0,0,0,0.05) !important; }
        body.light-theme .bg-white\/5 { background-color: rgba(0,0,0,0.04) !important; }
        body.light-theme .border-white\/10 { border-color: rgba(0,0,0,0.08) !important; }
        
        /* Toast Notification */
        .toast { animation: toast-in 0.4s ease-out forwards; }
        @keyframes toast-in { from { transform: translateY(20px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        .toast-out { animation: toast-out 0.3s ease-in forwards; }
        @keyframes toast-out { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(20px) scale(0.95); opacity: 0; } }
    </style>
</head>
<body class="font-inter">

    <!-- Backgrounds -->
    <div class="noise-bg"></div>
    <canvas id="bg-canvas"></canvas>

    <!-- Top Navigation -->
    <nav class="fixed top-0 w-full p-6 flex justify-between items-center z-20">
        <a href="Landing Page Courtbook.html" class="flex items-center gap-2 text-sm font-medium text-neutral-400 hover:text-white transition-colors group">
            <span class="text-xs group-hover:-translate-x-1 transition-transform">◀</span>
            Kembali
        </a>
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full hover:bg-white/5 border border-transparent hover:border-white/10 transition-all flex items-center justify-center text-lg" aria-label="Toggle Theme">
            <span id="theme-icon">☀️</span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
        <div class="glass-strong w-full max-w-md rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
            
            <!-- Glow Accent -->
            <div id="glow-accent" class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-1 bg-gradient-to-r from-book-400 via-book-500 to-book-600 shadow-[0_0_20px_rgba(34,197,94,0.8)] transition-all duration-500"></div>

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2 mb-6">
                    <img src="https://z-cdn-media.chatglm.cn/files/73e3e7f9-1a5d-42ab-9c8d-356a7f6d174e.png?auth_key=1876485946-3cd1841e060a489d8115899a606120f4-0-e846344c935a50cd69753a3886bad3b7" alt="CourtBook" class="h-10 w-10 rounded-full object-contain bg-white/5 p-1 border border-white/10">
                </div>
                <h1 class="text-2xl font-semibold tracking-tight mb-2">Selamat Datang</h1>
                <p class="text-sm text-neutral-400 font-light">Masuk untuk melanjutkan ke CourtBook.</p>
            </div>

            <!-- Role Toggle -->
            <div class="flex p-1 bg-white/5 border border-white/10 rounded-xl mb-8">
                <button onclick="switchRole('user')" id="btn-tab-user" class="tab-btn active-user flex-1 py-2 rounded-lg text-sm font-medium border border-transparent">
                    <span class="mr-1.5">👤</span> Pemain
                </button>
                <button onclick="switchRole('admin')" id="btn-tab-admin" class="tab-btn flex-1 py-2 rounded-lg text-sm font-medium text-neutral-500 border border-transparent hover:text-neutral-300">
                    <span class="mr-1.5">🛡️</span> Admin
                </button>
            </div>

            <!-- Form User -->
            <form id="form-user" class="fade-in space-y-5" onsubmit="handleLogin(event, 'user')">
                <div>
                    <label class="block text-xs font-medium text-neutral-400 mb-1.5 pl-1">Email</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500">✉️</span>
                        <input type="email" required placeholder="pemain@email.com" class="input-glass w-full rounded-xl py-3 pl-11 pr-4 text-sm" value="ahmad@email.com">
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-end mb-1.5 pl-1 pr-1">
                        <label class="block text-xs font-medium text-neutral-400">Password</label>
                        <a href="#" class="text-[10px] text-book-400 hover:text-book-300 transition-colors">Lupa sandi?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500">🔒</span>
                        <input type="password" required placeholder="••••••••" class="input-glass w-full rounded-xl py-3 pl-11 pr-4 text-sm" value="123456">
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full text-black font-semibold text-sm py-3.5 rounded-xl mt-4 flex items-center justify-center gap-2">
                    Masuk sebagai Pemain <span class="text-lg leading-none">➔</span>
                </button>
                <p class="text-center text-xs text-neutral-400 mt-6">
                    Belum punya akun? <a href="#" class="text-book-400 hover:text-book-300 font-medium transition-colors">Daftar sekarang</a>
                </p>
            </form>

            <!-- Form Admin -->
            <form id="form-admin" class="hidden space-y-5" onsubmit="handleLogin(event, 'admin')">
                <div>
                    <label class="block text-xs font-medium text-neutral-400 mb-1.5 pl-1">ID Admin / Email</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500">🛡️</span>
                        <input type="text" required placeholder="admin@courtbook.com" class="input-glass admin-focus w-full rounded-xl py-3 pl-11 pr-4 text-sm" value="admin">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-neutral-400 mb-1.5 pl-1">Kata Sandi Akses</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500">🔑</span>
                        <input type="password" required placeholder="••••••••" class="input-glass admin-focus w-full rounded-xl py-3 pl-11 pr-4 text-sm" value="admin123">
                    </div>
                </div>
                <button type="submit" class="btn-admin w-full text-white font-semibold text-sm py-3.5 rounded-xl mt-4 flex items-center justify-center gap-2">
                    Masuk Dashboard Admin <span class="text-lg leading-none">➔</span>
                </button>
                <div class="bg-court-500/10 border border-court-500/20 rounded-xl p-3 mt-6 flex gap-3 items-start">
                    <span class="text-court-400 mt-0.5">ℹ️</span>
                    <p class="text-[10px] text-neutral-400 leading-relaxed">Akses ini khusus untuk pengelola lapangan. Sistem akan mencatat riwayat login untuk keamanan.</p>
                </div>
            </form>

        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[60] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        // ===== Role Switcher Logic =====
        function switchRole(role) {
            const formUser = document.getElementById('form-user');
            const formAdmin = document.getElementById('form-admin');
            const btnUser = document.getElementById('btn-tab-user');
            const btnAdmin = document.getElementById('btn-tab-admin');
            const glowAccent = document.getElementById('glow-accent');

            if (role === 'user') {
                formUser.classList.remove('hidden');
                formUser.classList.add('fade-in');
                formAdmin.classList.add('hidden');
                formAdmin.classList.remove('fade-in');

                btnUser.classList.add('active-user');
                btnUser.classList.remove('text-neutral-500');
                btnAdmin.classList.remove('active-admin');
                btnAdmin.classList.add('text-neutral-500');

                glowAccent.className = 'absolute top-0 left-1/2 -translate-x-1/2 w-full h-1 bg-gradient-to-r from-book-400 via-book-500 to-book-600 shadow-[0_0_20px_rgba(34,197,94,0.8)] transition-all duration-500';
            } else {
                formAdmin.classList.remove('hidden');
                formAdmin.classList.add('fade-in');
                formUser.classList.add('hidden');
                formUser.classList.remove('fade-in');

                btnAdmin.classList.add('active-admin');
                btnAdmin.classList.remove('text-neutral-500');
                btnUser.classList.remove('active-user');
                btnUser.classList.add('text-neutral-500');

                glowAccent.className = 'absolute top-0 left-1/2 -translate-x-1/2 w-full h-1 bg-gradient-to-r from-court-400 via-court-500 to-court-600 shadow-[0_0_20px_rgba(59,130,246,0.8)] transition-all duration-500';
            }
        }

        // ===== Fake Login Handler =====
        function handleLogin(e, role) {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Memproses...';
            btn.style.opacity = '0.8';
            btn.disabled = true;

            setTimeout(() => {
                showToast('Login berhasil! Mengalihkan...', 'success', role);
                setTimeout(() => {
                    if(role === 'user'){
                        window.location.href = 'Dashboard User.html';
                    } else {
                        window.location.href = 'Dashboard Admin.html';
                    }
                }, 1000);
            }, 1000);
        }

        // ===== Theme Logic =====
        function applyTheme(theme) {
            const icon = document.getElementById('theme-icon');
            if (theme === 'light') {
                document.body.classList.add('light-theme');
                if (icon) icon.textContent = '🌙';
                localStorage.setItem('courtbook-theme', 'light');
            } else {
                document.body.classList.remove('light-theme');
                if (icon) icon.textContent = '☀️';
                localStorage.setItem('courtbook-theme', 'dark');
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.contains('light-theme');
            applyTheme(isLight ? 'dark' : 'light');
        }

        // Initialize Theme Based on LocalStorage
        const savedTheme = localStorage.getItem('courtbook-theme') || 'dark';
        applyTheme(savedTheme);


        // ===== Toast Notification =====
        function showToast(message, type = 'info', role = 'user') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let colorClass = 'text-book-400 border-book-500/20 bg-book-500/10';
            let icon = '✅';
            
            if (role === 'admin') {
                colorClass = 'text-court-400 border-court-500/20 bg-court-500/10';
            }

            toast.className = 'toast pointer-events-auto glass-strong rounded-xl px-5 py-3 flex items-center gap-3 max-w-sm border border-white/10';
            toast.innerHTML = `
                <div class="w-7 h-7 rounded-lg ${colorClass} flex items-center justify-center flex-shrink-0">
                    <span class="text-sm">${icon}</span>
                </div>
                <p class="text-xs text-neutral-300 font-medium">${message}</p>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ===== 3D Particle Background =====
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let mouseX = 0, mouseY = 0;
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.z = Math.random() * 1000;
                this.vx = (Math.random() - 0.5) * 0.25;
                this.vy = (Math.random() - 0.5) * 0.25;
                this.vz = -(Math.random() * 1.5 + 0.5);
                this.isGreen = Math.random() > 0.5; // 50% chance green or blue
            }
            update() {
                this.x += this.vx + (mouseX - canvas.width / 2) * 0.00005;
                this.y += this.vy + (mouseY - canvas.height / 2) * 0.00005;
                this.z += this.vz;
                if (this.z < 1) this.reset();
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw(isLight) {
                const scale = 400 / this.z;
                const sx = (this.x - canvas.width / 2) * scale + canvas.width / 2;
                const sy = (this.y - canvas.height / 2) * scale + canvas.height / 2;
                const alpha = Math.min(1, (1000 - this.z) / 500);
                const size = scale * 1.5;
                
                // Color mapping: Green (user) or Blue (admin)
                const g = this.isGreen;
                const r = g ? 34 : 59;
                const gg = g ? 197 : 130;
                const b = g ? 94 : 246;
                
                const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, size);
                const alphaMultiplier = isLight ? 0.8 : 0.7;
                
                grad.addColorStop(0, `rgba(${r},${gg},${b},${alpha * alphaMultiplier})`);
                grad.addColorStop(0.4, `rgba(${r},${gg},${b},${alpha * (isLight ? 0.3 : 0.2)})`);
                grad.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle()); // Sedikit dikurangi agar tidak terlalu ramai untuk form login

        function animateParticles() {
            const isLight = document.body.classList.contains('light-theme');
            ctx.fillStyle = isLight ? 'rgba(248, 250, 252, 0.4)' : 'rgba(5,5,5,0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => { p.update(); p.draw(isLight); });

            // Draw connections
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i], p2 = particles[j];
                    const s1 = 400 / p1.z, s2 = 400 / p2.z;
                    const x1 = (p1.x - canvas.width/2)*s1 + canvas.width/2;
                    const y1 = (p1.y - canvas.height/2)*s1 + canvas.height/2;
                    const x2 = (p2.x - canvas.width/2)*s2 + canvas.width/2;
                    const y2 = (p2.y - canvas.height/2)*s2 + canvas.height/2;
                    const dist = Math.hypot(x1-x2, y1-y2);
                    if (dist < 80) {
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        const alphaDist = (1 - dist/80);
                        const alphaVal = alphaDist * (isLight ? 0.15 : 0.08); 
                        // Warna garis disesuaikan dengan partikel
                        const strokeColor = p1.isGreen ? `rgba(34,197,94,${alphaVal})` : `rgba(59,130,246,${alphaVal})`;
                        ctx.strokeStyle = strokeColor;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>

</body>
</html>
